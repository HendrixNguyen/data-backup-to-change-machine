name: test
on: [push, pull_request]
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install pytest
      - run: python bin/backup.py --version
      - run: python -m pytest -q

  wsl:
    # WSL is Linux to Python but sits next to a Windows home, so it gets its own run.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-24.04
          additional-packages: python3 python3-pip git
      - shell: wsl-bash {0}
        run: |
          set -eu
          python3 --version
          [ -f /proc/version ] && grep -qi microsoft /proc/version && echo "WSL confirmed"
          python3 -m pip install --break-system-packages pytest
          python3 bin/backup.py --version
          sh ./doctor.sh --version
          python3 -m pytest -q
